services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: xpart_secure_pass_2026
      POSTGRES_DB: xpart
    volumes:
      - xpart_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:xpart_secure_pass_2026@db:5432/xpart
      JWT_SECRET: xpart_super_secure_jwt_token_prod_998877_xyz
      PORT: 8080
      NODE_ENV: production
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - xpart_uploads:/app/uploads

  caddy:
    image: caddy:alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  xpart_db_data:
  xpart_uploads:
  caddy_data:
  caddy_config:
